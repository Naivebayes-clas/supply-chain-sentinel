# ============================================================
# Supply Chain Sentinel - Docker Compose
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: scs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: >
      bash -c "airflow db migrate && echo 'Airflow initialized.'"
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOGS_FOLDER: /opt/airflow/logs
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./ingestion:/opt/airflow/ingestion
      - ./data:/opt/airflow/data:rw   
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: airflow api-server
    ports:
      - "8080:8080"
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./ingestion:/opt/airflow/ingestion
      - ./data:/opt/airflow/data:rw   
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: airflow scheduler
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./ingestion:/opt/airflow/ingestion
      - ./data:/opt/airflow/data:rw   
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: airflow tasks
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./ingestion:/opt/airflow/ingestion
      - ./data:/opt/airflow/data:rw   
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: airflow dag-processor
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./ingestion:/opt/airflow/ingestion
      - ./data:/opt/airflow/data:rw   
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully   
 
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./agent:/app/agent
      - ./api:/app/api
      - ./data:/app/data
      - ./evals:/app/evals
      - ./observability:/app/observability    # ← add this line   
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["agent"]

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: scs-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    profiles: ["agent"]

  langfuse:
    image: langfuse/langfuse:3
    container_name: scs-langfuse
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      SALT: "scs-salt"
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy
    profiles: ["observability"]

  langfuse-db:
    image: postgres:16-alpine
    container_name: scs-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["observability"]

volumes:
  pgdata:
  airflow_logs:
  chroma_data:
  langfuse_pgdata:   
