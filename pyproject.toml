[project]
name = "supply-chain-sentinel"
version = "0.1.0"
description = "Agentic data platform for logistics ops"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "pipeline/tests"]
asyncio_mode = "auto"  
